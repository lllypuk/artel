name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.10.1
      - name: Versions, format, tests, race and build
        run: |
          go version
          golangci-lint version
          test -z "$(gofmt -l cmd internal)"
          go test ./...
          go test -race ./...
          go build ./cmd/...

  native-full-stack:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      # Host dependencies are installed only inside this disposable CI container.
      - name: Prepare ephemeral Arch environment
        run: |
          pacman -Syu --noconfirm --needed git go qt6-base qt6-declarative qt6-svg qt6-wayland clang python desktop-file-utils systemd libarchive
          useradd --create-home builder
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install pinned lint in container
        run: |
          GOBIN=/usr/local/bin go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.10.1
          go version
          golangci-lint version
          qmake6 -query QT_VERSION
          g++ --version
          clang-format --version
          pacman -Q
      - name: Mandatory native and full-stack gates (unprivileged)
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- env PATH="$PATH" GOLANGCI_LINT=/usr/local/bin/golangci-lint make check
          runuser -u builder -- env PATH="$PATH" GOLANGCI_LINT=/usr/local/bin/golangci-lint make package-check
