name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.10.1

      # Native/full-stack gates are added with packaging in foundation Task 8.
      - name: Test Go skeleton
        run: go test ./...

      - name: Build Go skeleton
        run: go build ./cmd/...
