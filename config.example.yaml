# Основная конфигурация agent-shatrov

telegram:
  token: ""              # @BotFather token
  allowed_users:         # whitelist chat_id (только ты)
    - 0
  proxy: ""             # прокси только для Telegram, e.g. "http://127.0.0.1:2080"

llm:
  provider: "glm"
  models:
    default: "glm-4-plus"
    fast: "glm-4-flash"
  base_url: "https://api.z.ai/api/coding/paas/v4"
  api_key: ""
  max_iterations: 10   # лимит шагов ReAct-цикла (tool call → LLM → ...)

database:
  path: "./data/agent.db"

shell:
  enabled: false          # включить когда будет готово
  # Максимальное время выполнения (секунды)
  timeout: 30
  # Разрешённые команды (whitelist)
  allowed_commands:
    - ls
    - cat
    - head
    - tail
    - grep
    - find
    - wc
    - date
    - whoami
    - df
    - free
    - uptime
    - ps
    - echo
    - pwd
  # Запрещённые паттерны (даже если команда в whitelist)
  blocked_patterns:
    - "rm -rf /"
    - "mkfs"
    - "dd if="
    - "> /dev/"
    - "chmod 777"
    - ":(){ :|:& };:"
    - "shutdown"
    - "reboot"
    - "init 0"
    - "init 6"
  # Рабочая директория (sandbox)
  working_dir: "./sandbox"

web:
  enabled: true
  # Провайдер: brave, serper, duckduckgo
  # brave  — https://api.search.brave.com  (2000 бесплатных запросов/мес)
  # serper — https://serper.dev            (2500 бесплатных запросов)
  # duckduckgo — без ключа, но может блокировать боты
  provider: "brave"
  api_key: ""  # API ключ для brave/serper
  # Количество результатов поиска
  max_results: 5
  # Таймаут запросов (секунды)
  timeout: 15
  # Максимальный размер скачиваемой страницы (КБ)
  max_fetch_size_kb: 100

browser:
  enabled: true           # включить для автоматизации браузера
  # Директория для сохранения скриншотов
  screenshot_dir: "./data/screenshots"
  # Путь к agent-browser (опционально, по умолчанию "agent-browser")
  agent_browser_path: "agent-browser"
  # Таймаут выполнения операций (секунды)
  timeout_seconds: 30
  # Прокси для браузера (опционально), e.g. "http://127.0.0.1:2080"
  proxy: ""

pi_coder:
  enabled: false          # включить для доработки агента через pi
  # Директория проекта (абсолютный или относительный путь)
  project_dir: "."        # по умолчанию — текущая директория
  # Модель для pi (должна совпадать с флагом --model)
  model: "glm-4.7"
  # Таймаут выполнения pi (секунды), по умолчанию 300 (5 минут)
  timeout: 300

news:
  enabled: false          # включить для агрегации новостей
  # Интервал автоматического обновления фидов (минуты)
  fetch_interval_minutes: 30
  # Максимальный возраст новостей для хранения (дни)
  max_item_age_days: 30
  # Максимальное количество новостей на фид
  max_items_per_feed: 1000
  # HTTP таймаут для получения фидов (секунды)
  fetch_timeout_seconds: 30
  # Прокси по умолчанию для всех фидов (опционально), e.g. "http://127.0.0.1:2080"
  # Можно переопределить на уровне конкретного фида через proxy:
  proxy: ""
  # Предустановленные источники новостей
  feeds:
    # Tech news
    - url: "https://techcrunch.com/feed/"
      title: "TechCrunch"
      category: "technology"
      language: "en"
      enabled: false
      proxy: ""           # прокси для этого фида (опционально)
    - url: "https://www.theverge.com/rss/index.xml"
      title: "The Verge"
      category: "technology"
      language: "en"
      enabled: false
      proxy: ""
    - url: "https://feeds.arstechnica.com/arstechnica/index"
      title: "Ars Technica"
      category: "technology"
      language: "en"
      enabled: false
      proxy: ""
    # Open Source / Dev
    - url: "https://lwn.net/headlines/newrss"
      title: "LWN.net"
      category: "programming"
      language: "en"
      enabled: false
      proxy: ""
    - url: "https://opensource.com/feeds"
      title: "Opensource.com"
      category: "programming"
      language: "en"
      enabled: false
      proxy: ""
    # Go
    - url: "https://go.dev/blog/feed.atom"
      title: "Go Blog"
      category: "programming"
      language: "en"
      enabled: false
      proxy: ""

logging:
  level: "info"           # debug, info, warn, error
  file: "./data/agent.log"
