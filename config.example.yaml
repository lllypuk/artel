# Конфигурация agent-shatrov
#
# ── ЧТО ОБЯЗАТЕЛЬНО ЗАПОЛНИТЬ ──────────────────────────────────────────────────
#
#   telegram.token       — токен от @BotFather
#   telegram.allowed_users — твой chat_id (узнать: @userinfobot в Telegram)
#   llm.api_key          — API-ключ LLM-провайдера
#
# Или через переменные окружения (удобно для Docker):
#   TELEGRAM_TOKEN, TELEGRAM_ALLOWED_USERS (comma-separated IDs)
#   LLM_API_KEY, LLM_BASE_URL, WEB_API_KEY, LOG_LEVEL
# ───────────────────────────────────────────────────────────────────────────────

telegram:
  token: ""              # токен от @BotFather
  allowed_users:         # твой chat_id (узнать: @userinfobot в Telegram)
    - 0
  proxy: ""              # прокси только для Telegram (опционально), e.g. "http://127.0.0.1:2080"

llm:
  provider: "glm"
  base_url: "https://api.z.ai/api/coding/paas/v4"
  api_key: ""            # ← ЗАПОЛНИ: API-ключ LLM-провайдера
  models:
    default: "glm-4-plus"
    fast: "glm-4-flash"
  max_iterations: 10     # лимит шагов ReAct-цикла (tool call → LLM → ...)
  max_context_messages: 50  # лимит сообщений в окне LLM-контекста (0 = без ограничений)

  # Мультипровайдер с fallback (опционально).
  # Если providers заданы, base_url / api_key выше игнорируются.
  # Провайдеры пробуются по приоритету (priority: меньше = первым).
  # providers:
  #   - name: "zai"
  #     base_url: "https://api.z.ai/api/coding/paas/v4"
  #     api_key: ""
  #     priority: 1
  #     models:
  #       default: "glm-4-plus"
  #       fast: "glm-4-flash"
  #
  #   - name: "openrouter"
  #     base_url: "https://openrouter.ai/api/v1"
  #     api_key: ""               # ключ из https://openrouter.ai/keys
  #     priority: 2
  #     models:
  #       default: "google/gemini-2.5-flash"
  #       fast: "google/gemini-2.5-flash"
  #     extra_headers:
  #       HTTP-Referer: "https://github.com/lllypuk/agent-shatrov"
  #       X-Title: "agent-shatrov"
  #     proxy: ""
  #     timeout_seconds: 120
  #
  # retry:
  #   max_retries: 2
  #   initial_backoff_ms: 500
  #   max_backoff_ms: 5000

database:
  path: "./data/agent.db"

logging:
  level: "info"           # debug, info, warn, error
  file: "./data/agent.log"

# ── ДОПОЛНИТЕЛЬНЫЕ ВОЗМОЖНОСТИ (по умолчанию работают из коробки) ───────────────

proactive:
  enabled: false                   # включить для проактивных сообщений
  max_messages_per_day: 7          # максимум сообщений в день от агента
  morning_briefing: "08:00"        # время утреннего брифинга ("" = выключено)
  evening_checkin: "21:00"         # время вечернего чек-ина ("" = выключено)
  weekly_report: "20:00"           # время воскресного отчёта ("" = выключено)
  goal_reminder_days_idle: 3       # напоминать о цели если нет прогресса N дней (0 = выключено)
  timezone: "Europe/Moscow"        # часовой пояс ("" = локальное время сервера)
  city: "Москва"                   # город для погоды в утреннем брифинге ("" = без погоды)
  financial_tickers:               # тикеры для финансовой сводки (утро + вечер)
    - "IMOEX"                      # Индекс МосБиржи
    - "RTSI"                       # Индекс РТС
    - "sp500"                      # S&P 500
    - "nasdaq"                     # Nasdaq Composite

web:
  enabled: true
  # Провайдер: brave, serper, duckduckgo
  # brave      — https://api.search.brave.com  (2000 бесплатных запросов/мес)
  # serper     — https://serper.dev            (2500 бесплатных запросов)
  # duckduckgo — без ключа, но может блокировать боты
  provider: "brave"
  api_key: ""            # API ключ для brave/serper
  max_results: 5
  timeout: 15
  max_fetch_size_kb: 100

weather:
  enabled: true          # Open-Meteo, бесплатно, без API-ключа
  timeout_seconds: 15
  proxy: ""              # прокси для запросов к Open-Meteo (опционально)

stocks:
  enabled: true          # котировки акций и индексов (Yahoo Finance + MOEX ISS, без API-ключей)
  cache_ttl_minutes: 15  # TTL кэша котировок в SQLite (0 = без кэша)
  timeout_seconds: 15
  proxy: ""              # "" = использует HTTPS_PROXY из env

# ── ДОПОЛНИТЕЛЬНЫЕ ИНСТРУМЕНТЫ (по умолчанию выключены) ───────────────────────

news:
  enabled: false                   # включить для агрегации новостей
  fetch_interval_minutes: 30
  max_item_age_days: 30
  max_items_per_feed: 1000
  fetch_timeout_seconds: 30
  proxy: ""
  feeds:
    # Раскомментировать нужные фиды и поставить enabled: true
    - url: "https://hnrss.org/frontpage"
      title: "Hacker News"
      category: "technology"
      language: "en"
      enabled: false
    - url: "https://go.dev/blog/feed.atom"
      title: "Go Blog"
      category: "programming"
      language: "en"
      enabled: false
    - url: "https://techcrunch.com/feed/"
      title: "TechCrunch"
      category: "technology"
      language: "en"
      enabled: false
    - url: "https://www.theverge.com/rss/index.xml"
      title: "The Verge"
      category: "technology"
      language: "en"
      enabled: false
    - url: "https://feeds.arstechnica.com/arstechnica/index"
      title: "Ars Technica"
      category: "technology"
      language: "en"
      enabled: false
    - url: "https://feeds.bloomberg.com/markets/news.rss"
      title: "Bloomberg Markets"
      category: "finance"
      language: "en"
      enabled: false
    - url: "https://finance.yahoo.com/news/rssindex"
      title: "Yahoo Finance News"
      category: "finance"
      language: "en"
      enabled: false
    - url: "https://www.moex.com/export/news.aspx"
      title: "MOEX News"
      category: "finance"
      language: "ru"
      enabled: false
    - url: "https://krebsonsecurity.com/feed/"
      title: "Krebs on Security"
      category: "security"
      language: "en"
      enabled: false
    - url: "https://feeds.bbci.co.uk/sport/formula1/rss.xml"
      title: "BBC Sport — Formula 1"
      category: "formula1"
      language: "en"
      enabled: false

files:
  enabled: false                   # включить для обработки файлов и изображений
  storage_dir: "./data/files"
  max_file_size_kb: 10240          # 10 МБ
  vision_enabled: false            # передавать изображения в LLM как base64

code_runner:
  enabled: false                   # включить для выполнения кода (Python / Go / bash)
  timeout_seconds: 30
  mem_limit_mb: 0                  # 0 = без ограничений

shell:
  enabled: false                   # включать осторожно — даёт агенту доступ к shell
  timeout: 30
  working_dir: "./sandbox"
  allowed_commands:
    - ls
    - cat
    - head
    - tail
    - grep
    - find
    - wc
    - date
    - whoami
    - df
    - free
    - uptime
    - ps
    - echo
    - pwd
  blocked_patterns:
    - "rm -rf /"
    - "mkfs"
    - "dd if="
    - "> /dev/"
    - "chmod 777"
    - ":(){ :|:& };:"
    - "shutdown"
    - "reboot"
    - "init 0"
    - "init 6"

browser:
  enabled: false                   # требует установки бинарника agent-browser
  screenshot_dir: "./data/screenshots"
  agent_browser_path: "agent-browser"
  timeout_seconds: 30
  proxy: ""

pi_coder:
  enabled: false                   # включить для доработки агента через pi
  project_dir: "."
  model: "glm-4.7"
  timeout: 300
