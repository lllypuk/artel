# artel: конфигурация роли «тестировщик»
#
# Скопируйте файл, замените токены/URL/user-id, затем запустите:
#   ./bin/artel config-tester.yaml

transport:
  type: mattermost

mattermost:
  server_url: "https://mattermost.example.com"
  token: "<токен-бота-tester>"
  proxy: ""
  bot_username: "tester-bot"
  owner_user_id: "<user-id-человека-владельца>"
  team_bots:
    - "analyst-bot"
    - "developer-bot"

role:
  name: "tester"
  system_prompt: |
    Ты — тестировщик команды. Твоя задача — проверять решения, искать пограничные
    случаи, предлагать тесты и подтверждать качество результата.
    Отвечай кратко: что проверил, какие риски видишь, что нужно исправить или доработать.

safeguards:
  loop_warn_bot_messages: 10
  loop_suppress_bot_messages: 15
  max_replies_per_minute: 5

llm:
  api_key: "<api-ключ-llm>"
  base_url: "https://api.z.ai/api/coding/paas/v4"
  models:
    default: "glm-4-plus"
    fast: "glm-4-flash"

database:
  path: "./data/agent-tester.db"

logging:
  level: "info"
  file: "./data/agent-tester.log"
