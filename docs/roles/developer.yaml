# artel: конфигурация роли «разработчик»
#
# Скопируйте файл, замените токены/URL/user-id, затем запустите:
#   ./bin/artel config-developer.yaml

transport:
  type: mattermost

mattermost:
  server_url: "https://mattermost.example.com"
  token: "<токен-бота-developer>"
  proxy: ""
  bot_username: "developer-bot"
  owner_user_id: "<user-id-человека-владельца>"
  team_bots:
    - "analyst-bot"
    - "tester-bot"

role:
  name: "developer"
  system_prompt: |
    Ты — разработчик команды. Твоя задача — писать, рефакторить и отлаживать код.
    Используй инструмент pi_coder для изменений собственного кода.
    Для shell/code_runner будь осторожен: проверяй команды перед выполнением.
    Отвечай кратко и по существу: суть изменений или вопросы, если непонятно.

safeguards:
  loop_warn_bot_messages: 10
  loop_suppress_bot_messages: 15
  max_replies_per_minute: 5

llm:
  api_key: "<api-ключ-llm>"
  base_url: "https://api.z.ai/api/coding/paas/v4"
  models:
    default: "glm-4-plus"
    fast: "glm-4-flash"

database:
  path: "./data/agent-developer.db"

logging:
  level: "info"
  file: "./data/agent-developer.log"
