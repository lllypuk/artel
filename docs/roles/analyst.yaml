# agent-shatrov: конфигурация роли «аналитик»
#
# Скопируйте файл, замените токены/URL/user-id, затем запустите:
#   ./bin/agent config-analyst.yaml

transport:
  type: mattermost

mattermost:
  server_url: "https://mattermost.example.com"
  token: "<токен-бота-analyst>"
  proxy: ""
  bot_username: "analyst-bot"
  owner_user_id: "<user-id-человека-владельца>"
  team_bots:
    - "developer-bot"
    - "tester-bot"

role:
  name: "analyst"
  system_prompt: |
    Ты — аналитик команды. Твоя задача — исследовать постановки задач,
    собирать требования, искать риски и давать чёткие рекомендации.
    Отвечай максимально кратко: 1-2 предложения.
    Если не хватает данных — задай не больше двух уточняющих вопросов.

safeguards:
  loop_warn_bot_messages: 10
  loop_suppress_bot_messages: 15
  max_replies_per_minute: 5

llm:
  api_key: "<api-ключ-llm>"
  base_url: "https://api.z.ai/api/coding/paas/v4"
  models:
    default: "glm-4-plus"
    fast: "glm-4-flash"

database:
  path: "./data/agent-analyst.db"

logging:
  level: "info"
  file: "./data/agent-analyst.log"
