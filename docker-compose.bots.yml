# Docker Compose for multi-bot setup (analyst, developer, tester)
# All bots share the same image, but use separate config files and data volumes.
#
# Usage:
#   docker compose -f docker-compose.bots.yml up -d
#   docker compose -f docker-compose.bots.yml logs -f analyst
#
# Prerequisites:
#   - configs/analyst-bot.yaml, configs/developer-bot.yaml, configs/tester-bot.yaml
#   - ~/Project directory with git repos
#   - ~/.ssh with SSH keys for git access
#   - ~/.pi with pi configuration (Ollama endpoint etc.)

services:
  analyst:
    build: .
    image: agent-shatrov:latest
    restart: always
    command: ["/config.yaml"]
    volumes:
      # Common volumes
      - ~/Project:/home/projects:rw
      - ~/.ssh:/home/agent/.ssh:ro
      - ~/.pi:/home/agent/.pi:rw
      # Per-service config
      - ./configs/analyst-bot.yaml:/config.yaml:ro
      # Per-service data volume
      - analyst_data:/home/agent/data
    extra_hosts:
      - "host-gateway:host-gateway"
    environment:
      - GIT_AUTHOR_NAME=analyst-bot
      - GIT_AUTHOR_EMAIL=analyst-bot@host-gateway
      - GIT_COMMITTER_NAME=analyst-bot
      - GIT_COMMITTER_EMAIL=analyst-bot@host-gateway
      - LLM_BASE_URL=http://host-gateway:11434/v1
      - OLLAMA_BASE_URL=http://host-gateway:11434
      - OLLAMA_HOST=http://host-gateway:11434
      - HOME=/home/agent

  developer:
    build: .
    image: agent-shatrov:latest
    restart: always
    command: ["/config.yaml"]
    volumes:
      # Common volumes
      - ~/Project:/home/projects:rw
      - ~/.ssh:/home/agent/.ssh:ro
      - ~/.pi:/home/agent/.pi:rw
      # Per-service config
      - ./configs/developer-bot.yaml:/config.yaml:ro
      # Per-service data volume
      - developer_data:/home/agent/data
    extra_hosts:
      - "host-gateway:host-gateway"
    environment:
      - GIT_AUTHOR_NAME=developer-bot
      - GIT_AUTHOR_EMAIL=developer-bot@host-gateway
      - GIT_COMMITTER_NAME=developer-bot
      - GIT_COMMITTER_EMAIL=developer-bot@host-gateway
      - LLM_BASE_URL=http://host-gateway:11434/v1
      - OLLAMA_BASE_URL=http://host-gateway:11434
      - OLLAMA_HOST=http://host-gateway:11434
      - HOME=/home/agent

  tester:
    build: .
    image: agent-shatrov:latest
    restart: always
    command: ["/config.yaml"]
    volumes:
      # Common volumes
      - ~/Project:/home/projects:rw
      - ~/.ssh:/home/agent/.ssh:ro
      - ~/.pi:/home/agent/.pi:rw
      # Per-service config
      - ./configs/tester-bot.yaml:/config.yaml:ro
      # Per-service data volume
      - tester_data:/home/agent/data
    extra_hosts:
      - "host-gateway:host-gateway"
    environment:
      - GIT_AUTHOR_NAME=tester-bot
      - GIT_AUTHOR_EMAIL=tester-bot@host-gateway
      - GIT_COMMITTER_NAME=tester-bot
      - GIT_COMMITTER_EMAIL=tester-bot@host-gateway
      - LLM_BASE_URL=http://host-gateway:11434/v1
      - OLLAMA_BASE_URL=http://host-gateway:11434
      - OLLAMA_HOST=http://host-gateway:11434
      - HOME=/home/agent

volumes:
  analyst_data:
  developer_data:
  tester_data: