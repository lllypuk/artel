services:
  agent:
    build: .
    image: artel:latest
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - agent_data:/app/data
    # If config.yaml uses a host proxy like http://127.0.0.1:2080, change it to
    # http://host-gateway:2080 when running in Docker so the container can reach the host.
    extra_hosts:
      - "host-gateway:host-gateway"
    restart: unless-stopped
    # Optionally override secrets via env vars (see supported vars below):
    # environment:
    #   - TELEGRAM_TOKEN=your_token
    #   - TELEGRAM_ALLOWED_USERS=123456789
    #   - LLM_API_KEY=your_key
    #   - LLM_BASE_URL=https://api.example.com/v1
    #   - WEB_API_KEY=your_web_search_key
    #   - LOG_LEVEL=info

volumes:
  agent_data:
