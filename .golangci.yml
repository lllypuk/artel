version: "2"
run:
  timeout: 5m
  modules-download-mode: readonly
linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - whitespace
    - bodyclose
    - noctx
    - gocritic
    - cyclop
    - gosec
  settings:
    cyclop:
      max-complexity: 20
issues:
  max-issues-per-linter: 50
  max-same-issues: 5
formatters:
  enable:
    - gofmt
    - goimports
