openapi: 3.0.3
info:
  title: Artel local manual API
  version: 0.1.0
  description: >-
    Loopback-only owner API. Domain mutations are owner_manual; they never run agents.
    Observer controls use separate observer audit/receipts and 16 KiB bodies.
    Domain endpoints are implemented by the transactional application layer.
    No Origin requests, redirects or CORS. Host must match the bound IPv4 address/port.
    JSON bodies are limited to 256 KiB; unknown fields and trailing JSON are rejected.
    Question and answer bodies have a separate 32 KiB limit; each text is at most 4 KiB UTF-8 without NUL.
    Receipts atomically persist successful mutation responses with domain changes/events.
    Reuse the same key after uncertain outcomes; a changed payload with that key is 409.
servers:
  - url: http://127.0.0.1:7331
security:
  - owner: []
paths:
  /v1/observers:
    $ref: './observer-openapi.yaml#/paths/~1v1~1observers'
  /v1/observers/{observer_id}:
    $ref: './observer-openapi.yaml#/paths/~1v1~1observers~1{observer_id}'
  /v1/observers/{observer_id}/binding:
    $ref: './observer-openapi.yaml#/paths/~1v1~1observers~1{observer_id}~1binding'
  /v1/observers/{observer_id}/revoke:
    $ref: './observer-openapi.yaml#/paths/~1v1~1observers~1{observer_id}~1revoke'
  /v1/observers/{observer_id}/prune:
    $ref: './observer-openapi.yaml#/paths/~1v1~1observers~1{observer_id}~1prune'
  /v1/tasks/{task_id}/messages:
    parameters: [{$ref: '#/components/parameters/TaskID'}]
    post:
      operationId: appendTaskMessage
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AppendMessage'}
      responses:
        '200':
          description: Stored commission or unchanged idempotent replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliveryMessage'}
        default: {$ref: '#/components/responses/Error'}
    get:
      operationId: listTaskMessages
      parameters:
        - {name: after, in: query, schema: {type: integer, minimum: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50}}
        - {name: ids, in: query, schema: {type: string}}
      responses:
        '200':
          description: One task page in record order with live statuses
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [messages, next_after]
                properties:
                  messages: {type: array, items: {$ref: '#/components/schemas/DeliveryMessage'}}
                  next_after: {type: integer, minimum: 0}
        default: {$ref: '#/components/responses/Error'}
  /delivery/v1/questions:
    post:
      servers: [{url: 'http://artel-observer'}]
      operationId: createOwnerQuestion
      description: Private delivery-UDS route. Authentication, exact active grant, writer and attach capability are checked before replay.
      security: [{DeliveryBearer: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateOwnerQuestion'}
      responses:
        '200':
          description: Question ID and stored acknowledgement; exact replay returns the original ID
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OwnerQuestionStored'}
        default: {$ref: '#/components/responses/DeliveryError'}
  /v1/tasks/{task_id}/questions:
    parameters: [{$ref: '#/components/parameters/TaskID'}]
    get:
      operationId: listTaskQuestions
      description: Cursor mode uses after/limit; refresh mode uses up to five ids. The modes are mutually exclusive.
      parameters:
        - {$ref: '#/components/parameters/Instance'}
        - {name: after, in: query, schema: {type: integer, minimum: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 5}}
        - {name: ids, in: query, description: Comma-separated UUIDs belonging to this task, schema: {type: string}}
      responses:
        '200':
          description: At most five immutable question/answer pairs, no more than 320 KiB
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OwnerQuestionPage'}
        default: {$ref: '#/components/responses/Error'}
  /v1/tasks/{task_id}/questions/{question_id}/answer:
    parameters:
      - {$ref: '#/components/parameters/TaskID'}
      - {name: question_id, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    post:
      operationId: answerTaskQuestion
      description: One answer and its delivery queue row commit atomically. Replay confirms storage, not live delivery status.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AnswerOwnerQuestion'}
      responses:
        '200':
          description: Stored answer or exact idempotent replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OwnerQuestionAnswered'}
        default: {$ref: '#/components/responses/Error'}
  /v1/tasks/{task_id}/delivery:
    parameters: [{$ref: '#/components/parameters/TaskID'}]
    get:
      operationId: taskDeliveryProjection
      responses:
        '200':
          description: Assignment, binding state and writer readiness without secrets
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliveryProjection'}
        default: {$ref: '#/components/responses/Error'}
  /v1/observers/{observer_id}/delivery:
    parameters: [{$ref: '#/components/parameters/ObserverID'}]
    put:
      operationId: enableDelivery
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnableDelivery'}
      responses:
        '200':
          description: Pending assignment; activation requires a writer attach
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliveryBinding'}
        default: {$ref: '#/components/responses/Error'}
  /v1/observers/{observer_id}/delivery/revoke:
    parameters: [{$ref: '#/components/parameters/ObserverID'}]
    post:
      operationId: revokeDelivery
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
                  type: object
                  additionalProperties: false
                  required: [delivery_binding_id]
                  properties:
                    delivery_binding_id: {$ref: '#/components/schemas/UUID'}
      responses:
        '200':
          description: Revoked assignment
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliveryBinding'}
        default: {$ref: '#/components/responses/Error'}
  /v1/observers/{observer_id}/delivery/{delivery_binding_id}:
    parameters:
      - {$ref: '#/components/parameters/ObserverID'}
      - {name: delivery_binding_id, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    get:
      operationId: deliveryBindingStatus
      responses:
        '200':
          description: Binding identity and state; writer markers are never exposed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliveryBinding'}
        default: {$ref: '#/components/responses/Error'}
  /healthz:
    get:
      operationId: health
      security: []
      responses:
        '200':
          description: Liveness only
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: {type: string, enum: [ok]}
        '400': {$ref: '#/components/responses/BadRequest'}
  /v1/snapshot:
    get:
      operationId: snapshot
      responses:
        '200':
          description: Complete consistent read transaction; never truncated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Snapshot'}
        '413': {$ref: '#/components/responses/TooLarge'}
        default: {$ref: '#/components/responses/Error'}
  /v1/projects:
    post:
      operationId: createProject
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateProject'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        default: {$ref: '#/components/responses/Error'}
  /v1/projects/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    patch:
      operationId: editProject
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EditProject'}
      responses:
        '200':
          description: Updated or unchanged project
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        default: {$ref: '#/components/responses/Error'}
  /v1/projects/{id}/tasks:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: createTask
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTask'}
      responses:
        '201':
          description: Created in backlog
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        default: {$ref: '#/components/responses/Error'}
  /v1/tasks/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    patch:
      operationId: editTask
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EditTask'}
      responses:
        '200':
          description: Updated or unchanged task; project/state immutable here
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        default: {$ref: '#/components/responses/Error'}
  /v1/tasks/{task_id}/results:
    parameters: [{$ref: '#/components/parameters/TaskID'}]
    post:
      operationId: submitTaskResult
      description: >-
        Atomically records an immutable owner-submitted Git candidate and CASes the
        current result. expected_result_id is empty only when no result is expected.
        Exact request receipt replay is checked before that CAS, including after newer submissions.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubmitTaskResult'}
      responses:
        '201':
          description: Submitted candidate or exact original request receipt replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskResult'}
        default: {$ref: '#/components/responses/Error'}
    get:
      operationId: taskResultHistory
      description: Bounded task-scoped submissions and reviews in event order; late reviews retain their original result_id.
      parameters:
        - {name: after, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: Current result ID and a bounded history page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskResultHistoryPage'}
        default: {$ref: '#/components/responses/Error'}
  /v1/tasks/{task_id}/results/current:
    parameters: [{$ref: '#/components/parameters/TaskID'}]
    get:
      operationId: currentTaskResult
      description: >-
        Bounded current-candidate read, independent of review and submission history.
        The compatibility reviews array is always empty; read current/reviews pages until
        has_more is false before making a decision. Null result confirms no current result.
      responses:
        '200':
          description: Current candidate without unbounded review evidence
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentTaskResult'}
        default: {$ref: '#/components/responses/Error'}
  /v1/tasks/{task_id}/results/current/reviews:
    parameters: [{$ref: '#/components/parameters/TaskID'}]
    get:
      operationId: currentTaskReviews
      description: >-
        Bounded insertion-order reviews for the candidate current in this read transaction.
        result_id must match the loaded candidate; next_after is the UUID cursor for the next page.
      parameters:
        - {name: after, in: query, allowEmptyValue: true, schema: {$ref: '#/components/schemas/ReviewCursor'}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        '200':
          description: One bounded current-candidate review page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentTaskReviewsPage'}
        default: {$ref: '#/components/responses/Error'}
  /v1/tasks/{task_id}/results/{result_id}/reviews:
    parameters:
      - {$ref: '#/components/parameters/TaskID'}
      - {name: result_id, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    post:
      operationId: attachTaskReview
      description: >-
        Attaches normalized review evidence without changing task state, queue or assignment.
        Stored result task/repo/base/head are authoritative; matching request values are only assertions.
        The business uniqueness key is repo/revmux_task/run. An identical existing attachment returns
        the original review without another event; transfer or changed normalized payload is 409.
        Exact request receipt replay remains available after project archival, but a fresh request
        for the same business key is rejected with 409 by the archive guard.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AttachTaskReview'}
      responses:
        '201':
          description: Attached review or exact original request receipt replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskReview'}
        '200':
          description: Existing identical review for the same repo/task/run business key
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskReview'}
        default: {$ref: '#/components/responses/Error'}
  /v1/tasks/{id}/transition:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      operationId: transitionTask
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [state, expected_version]
              properties:
                state: {enum: [backlog, in_progress, done, cancelled]}
                expected_version: {$ref: '#/components/schemas/Version'}
                expected_queue_version:
                  description: Required when leaving queued; only the first queued task may start.
                  type: integer
                  minimum: 1
                expected_result_id:
                  $ref: '#/components/schemas/ExpectedResultID'
      responses:
        '200':
          description: Task manually transitioned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        default: {$ref: '#/components/responses/Error'}
  /v1/projects/{id}/queue:
    parameters: [{$ref: '#/components/parameters/ID'}]
    put:
      operationId: replaceQueue
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [task_ids, expected_queue_version]
              properties:
                task_ids:
                  type: array
                  uniqueItems: true
                  items: {$ref: '#/components/schemas/UUID'}
                expected_queue_version: {$ref: '#/components/schemas/Version'}
      responses:
        '200':
          description: Full ordered queue; no-op preserves version/event count
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Queue'}
        default: {$ref: '#/components/responses/Error'}
  /v1/events:
    get:
      operationId: events
      parameters:
        - {$ref: '#/components/parameters/Instance'}
        - {$ref: '#/components/parameters/After'}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {name: project_id, in: query, schema: {$ref: '#/components/schemas/UUID'}}
        - {name: task_id, in: query, schema: {$ref: '#/components/schemas/UUID'}}
      responses:
        '200':
          description: Next cursor accounts for scanned range even with filters
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [instance_id, events, next_cursor]
                properties:
                  instance_id: {$ref: '#/components/schemas/UUID'}
                  events: {type: array, items: {$ref: '#/components/schemas/Event'}}
                  next_cursor: {type: integer, minimum: 0}
        default: {$ref: '#/components/responses/Error'}
  /v1/stream:
    get:
      operationId: stream
      description: >-
        Replay persisted events after cursor, then tail with heartbeat comments.
        SSE id is event sequence, event is invalidation, data contains kind/object IDs,
        not descriptions. Bounded slow consumers disconnect and replay from last cursor.
        Wrong instance/future cursor returns 409 reset_required before streaming.
        On reconnect obtain a new snapshot; instance changes reset cursors.
      parameters:
        - {$ref: '#/components/parameters/Instance'}
        - {$ref: '#/components/parameters/After'}
      responses:
        '200':
          description: Authenticated invalidation stream (Bearer header, never URL token)
          content:
            text/event-stream:
              schema: {type: string}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    OwnerBearer:
      type: http
      scheme: bearer
      description: Private owner credential; same credential as owner.
    owner:
      type: http
      scheme: bearer
      description: 32 random bytes encoded as 64 hex characters, read from private local file.
    DeliveryBearer:
      type: http
      scheme: bearer
      description: Delivery-only credential on the private Unix socket; never interchangeable with owner or observer credentials.
  parameters:
    ID: {name: id, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    TaskID: {name: task_id, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    ObserverID: {name: observer_id, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    Instance: {name: instance_id, in: query, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    After: {name: after, in: query, required: true, schema: {type: integer, minimum: 0}}
  responses:
    BadRequest:
      description: Invalid request, Host, Origin, JSON or field validation
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    TooLarge:
      description: Request over 256 KiB or snapshot over 32 MiB
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Error:
      description: >-
        400 invalid request; 401 missing/wrong owner credential; 404 object not found;
        409 version/invariant/idempotency conflict or reset_required;
        413 size limit; 500 sanitized internal failure.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    DeliveryError:
      description: Sanitized delivery error; no question text, token or internal detail is echoed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/DeliveryError'}
  schemas:
    UUID: {type: string, format: uuid}
    ExpectedResultID:
      type: string
      maxLength: 36
      pattern: '^$|^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      description: Canonical current result UUID, or empty to assert that no result exists. Omission is legacy only when no result exists.
    ReviewCursor:
      type: string
      maxLength: 36
      pattern: '^$|^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      description: Current-candidate review UUID, or empty for the first page.
    FullSHA: {type: string, pattern: '^[0-9a-f]{40}$'}
    ReviewRequirement:
      type: object
      additionalProperties: false
      required: [name, executor]
      properties:
        name: {type: string, minLength: 1, maxLength: 200, description: 'Non-empty valid UTF-8, additionally limited to 200 bytes; no NUL.'}
        executor: {type: string, minLength: 1, maxLength: 120, description: 'Non-empty valid UTF-8, additionally limited to 120 bytes; no NUL.'}
    ReviewSource:
      type: object
      additionalProperties: false
      required: [name, executor, required, responded, degraded, findings, pre_existing, open_questions]
      properties:
        name: {type: string, minLength: 1, maxLength: 200, description: 'Non-empty valid UTF-8, additionally limited to 200 bytes; no NUL.'}
        executor: {type: string, minLength: 1, maxLength: 120, description: 'Non-empty valid UTF-8, additionally limited to 120 bytes; no NUL.'}
        required: {type: boolean, description: Derived from exact membership in required_sources.}
        responded: {type: boolean, description: 'A responded source with zero findings is not missing. Exactly one of responded and degraded is true.'}
        degraded: {type: boolean, description: 'Includes roster-only non-response evidence; a degraded reporter can still have counts.'}
        findings: {type: integer, minimum: 0, maximum: 9007199254740991}
        pre_existing: {type: integer, minimum: 0, maximum: 9007199254740991}
        open_questions: {type: integer, minimum: 0, maximum: 9007199254740991}
    SubmitTaskResult:
      type: object
      additionalProperties: false
      required: [repo, base, head, expected_result_id]
      properties:
        repo:
          type: string
          maxLength: 4096
          description: Canonical absolute, symlink-resolved Git common-dir identity; valid UTF-8, additionally limited to 4096 bytes, no NUL; not the project root or worktree path.
        base: {$ref: '#/components/schemas/FullSHA'}
        head: {$ref: '#/components/schemas/FullSHA'}
        summary: {type: string, maxLength: 4096, description: 'Optional owner summary; valid UTF-8, additionally limited to 4096 bytes, no NUL; no automatic verdict.'}
        expected_result_id: {$ref: '#/components/schemas/ExpectedResultID'}
    TaskResult:
      type: object
      additionalProperties: false
      required: [id, task_id, repo, base, head, summary, created_at]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        task_id: {$ref: '#/components/schemas/UUID'}
        repo: {type: string}
        base: {$ref: '#/components/schemas/FullSHA'}
        head: {$ref: '#/components/schemas/FullSHA'}
        summary: {type: string}
        created_at: {type: string, format: date-time}
    AttachTaskReview:
      type: object
      additionalProperties: false
      required: [repo, base, head, revmux_task, run, range_source, report_ref, complete, required_sources, sources, incomplete_reasons, findings, pre_existing, open_questions]
      properties:
        repo: {type: string, maxLength: 4096, description: 'Valid UTF-8, additionally limited to 4096 bytes; no NUL.'}
        base: {$ref: '#/components/schemas/FullSHA'}
        head: {$ref: '#/components/schemas/FullSHA'}
        revmux_task: {type: string, minLength: 1, maxLength: 200, description: 'Non-empty valid UTF-8, additionally limited to 200 bytes; no NUL.'}
        run: {type: string, minLength: 1, maxLength: 200, description: 'Non-empty valid UTF-8, additionally limited to 200 bytes; no NUL.'}
        range_source: {type: string, enum: [operator], description: 'Owner assertion, never independent Git attestation.'}
        report_ref: {type: string, minLength: 1, maxLength: 4096, description: 'Display-only local path or URI; never opened by the daemon. Valid UTF-8, additionally limited to 4096 bytes; no NUL.'}
        complete: {type: boolean, description: 'Completeness of required sources only, not acceptance or a clean review. Complete requires at least one required pair and a responding, non-degraded exact match for every pair.'}
        required_sources: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/ReviewRequirement'}}
        sources: {type: array, maxItems: 128, items: {$ref: '#/components/schemas/ReviewSource'}}
        incomplete_reasons: {type: array, maxItems: 32, items: {type: string, minLength: 1, maxLength: 500, description: 'Non-empty valid UTF-8, additionally limited to 500 bytes; no NUL.'}}
        findings: {type: integer, minimum: 0, maximum: 9007199254740991}
        pre_existing: {type: integer, minimum: 0, maximum: 9007199254740991}
        open_questions: {type: integer, minimum: 0, maximum: 9007199254740991}
    TaskReview:
      type: object
      additionalProperties: false
      required: [id, task_id, result_id, repo, base, head, revmux_task, run, range_source, report_ref, complete, required_sources, sources, incomplete_reasons, findings, pre_existing, open_questions, created_at]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        task_id: {$ref: '#/components/schemas/UUID'}
        result_id: {$ref: '#/components/schemas/UUID'}
        repo: {type: string, maxLength: 4096, description: 'Valid UTF-8, additionally limited to 4096 bytes; no NUL.'}
        base: {$ref: '#/components/schemas/FullSHA'}
        head: {$ref: '#/components/schemas/FullSHA'}
        revmux_task: {type: string, minLength: 1, maxLength: 200, description: 'Non-empty valid UTF-8, additionally limited to 200 bytes; no NUL.'}
        run: {type: string, minLength: 1, maxLength: 200, description: 'Non-empty valid UTF-8, additionally limited to 200 bytes; no NUL.'}
        range_source: {type: string, enum: [operator]}
        report_ref: {type: string, minLength: 1, maxLength: 4096, description: 'Valid UTF-8, additionally limited to 4096 bytes; no NUL.'}
        complete: {type: boolean}
        required_sources: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/ReviewRequirement'}}
        sources: {type: array, maxItems: 128, items: {$ref: '#/components/schemas/ReviewSource'}}
        incomplete_reasons: {type: array, maxItems: 32, items: {type: string, minLength: 1, maxLength: 500, description: 'Non-empty valid UTF-8, additionally limited to 500 bytes; no NUL.'}}
        findings: {type: integer, minimum: 0, maximum: 9007199254740991}
        pre_existing: {type: integer, minimum: 0, maximum: 9007199254740991}
        open_questions: {type: integer, minimum: 0, maximum: 9007199254740991}
        created_at: {type: string, format: date-time}
        evidence_consistent: {type: boolean, description: 'Read-only consistency projection; false when legacy required-source flags/pairs or counters are inconsistent. Out-of-range persisted counters are saturated to the safe-integer limit on reads. Never rewrites a receipt, so an original legacy receipt body may omit it.'}
    CurrentTaskResult:
      type: object
      additionalProperties: false
      required: [result, reviews]
      properties:
        result:
          oneOf:
            - {$ref: '#/components/schemas/TaskResult'}
            - type: object
              nullable: true
              enum: [null]
              description: Null when no candidate is current; never an empty object.
        reviews:
          type: array
          maxItems: 0
          description: Compatibility field, always empty; use the bounded current/reviews endpoint.
          items: {$ref: '#/components/schemas/TaskReview'}
    CurrentTaskReviewsPage:
      type: object
      additionalProperties: false
      required: [result_id, reviews, next_after, has_more]
      properties:
        result_id: {$ref: '#/components/schemas/ExpectedResultID'}
        reviews: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/TaskReview'}}
        next_after: {$ref: '#/components/schemas/ExpectedResultID'}
        has_more: {type: boolean}
    TaskResultHistoryEntry:
      type: object
      additionalProperties: false
      required: [seq, kind]
      properties:
        seq: {type: integer, minimum: 1}
        kind: {type: string, enum: [result, review]}
        result: {$ref: '#/components/schemas/TaskResult'}
        review: {$ref: '#/components/schemas/TaskReview'}
    TaskResultHistoryPage:
      type: object
      additionalProperties: false
      required: [current_result_id, entries, next_after, has_more]
      properties:
        current_result_id: {$ref: '#/components/schemas/ExpectedResultID'}
        entries: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/TaskResultHistoryEntry'}}
        next_after: {type: integer, minimum: 0}
        has_more: {type: boolean}
    QuestionText:
      type: string
      minLength: 1
      maxLength: 4096
      pattern: '^[^\x00]+$'
      description: Non-empty valid UTF-8, at most 4096 bytes (not merely code points), no NUL; preserved exactly.
    CreateOwnerQuestion:
      type: object
      additionalProperties: false
      required: [instance_id, task_id, writer_id, text]
      properties:
        instance_id: {$ref: '#/components/schemas/UUID'}
        task_id: {$ref: '#/components/schemas/UUID'}
        writer_id: {$ref: '#/components/schemas/UUID'}
        text: {$ref: '#/components/schemas/QuestionText'}
    AnswerOwnerQuestion:
      type: object
      additionalProperties: false
      required: [instance_id, text]
      properties:
        instance_id: {$ref: '#/components/schemas/UUID'}
        text: {$ref: '#/components/schemas/QuestionText'}
    OwnerQuestionStored:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        status: {type: string, enum: [stored]}
    OwnerQuestionAnswered:
      type: object
      additionalProperties: false
      required: [question_id, message_id, status]
      properties:
        question_id: {$ref: '#/components/schemas/UUID'}
        message_id: {$ref: '#/components/schemas/UUID'}
        status: {type: string, enum: [stored]}
    OwnerQuestion:
      type: object
      additionalProperties: false
      required: [id, task_id, delivery_binding_id, pi_session_id, text, status, created_at]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        task_id: {$ref: '#/components/schemas/UUID'}
        delivery_binding_id: {$ref: '#/components/schemas/UUID'}
        pi_session_id: {$ref: '#/components/schemas/UUID'}
        text: {$ref: '#/components/schemas/QuestionText'}
        status: {type: string, enum: [open, answered, closed]}
        answer_message_id: {$ref: '#/components/schemas/UUID'}
        answer_text: {$ref: '#/components/schemas/QuestionText'}
        answer_status: {type: string, enum: [stored, unknown, observed]}
        answer_block_reason: {type: string, enum: [task_closed, project_archived, delivery_revoked]}
        created_at: {type: string, format: date-time}
        answered_at: {type: string, format: date-time}
    OwnerQuestionPage:
      type: object
      additionalProperties: false
      required: [questions, next_after, has_more]
      properties:
        questions: {type: array, maxItems: 5, items: {$ref: '#/components/schemas/OwnerQuestion'}}
        next_after: {type: integer, minimum: 0}
        has_more:
          type: boolean
          description: True when another row exists after this cursor page; false for an ID refresh.
    DeliveryError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_request, unsafe_host, origin_forbidden, unauthorized, not_found, not_ready, closed, revoked, owner_conflict, assignment_mismatch, instance_mismatch, capability_required, idempotency_conflict, body_too_large, unavailable]
    Version: {type: integer, minimum: 1}
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string, description: 'Safe public error; no SQL, internal paths or credentials'}
        current_version: {$ref: '#/components/schemas/Version'}
    CreateProject:
      type: object
      additionalProperties: false
      required: [name, root_path]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        root_path: {type: string, description: Existing absolute directory; canonical root unique among active projects}
        description: {type: string, description: At most 16 KiB UTF-8}
    EditProject:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: {$ref: '#/components/schemas/Version'}
        name: {type: string, minLength: 1, maxLength: 120}
        root_path: {type: string}
        description: {type: string, description: At most 16 KiB UTF-8}
        archived: {type: boolean, description: Archive requires no queued/in_progress tasks; unarchive rechecks root uniqueness}
    Project:
      type: object
      additionalProperties: false
      required: [id, name, root_path, description, version, queue_version, archived, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        name: {type: string}
        root_path: {type: string}
        description: {type: string}
        version: {$ref: '#/components/schemas/Version'}
        queue_version: {$ref: '#/components/schemas/Version'}
        archived: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CreateTask:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, description: At most 64 KiB UTF-8}
        acceptance_criteria: {type: string, description: At most 64 KiB UTF-8}
    EditTask:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: {$ref: '#/components/schemas/Version'}
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, description: At most 64 KiB UTF-8}
        acceptance_criteria: {type: string, description: At most 64 KiB UTF-8}
    Task:
      type: object
      additionalProperties: false
      required: [id, project_id, title, description, acceptance_criteria, state, version, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        project_id: {$ref: '#/components/schemas/UUID'}
        title: {type: string}
        description: {type: string}
        acceptance_criteria: {type: string}
        state: {enum: [backlog, queued, in_progress, done, cancelled]}
        version: {$ref: '#/components/schemas/Version'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Queue:
      type: object
      additionalProperties: false
      required: [project_id, queue_version, task_ids]
      properties:
        project_id: {$ref: '#/components/schemas/UUID'}
        queue_version: {$ref: '#/components/schemas/Version'}
        task_ids: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/UUID'}}
    AppendMessage:
      type: object
      additionalProperties: false
      required: [text, delivery_binding_id, instance_id]
      properties:
        text: {type: string, minLength: 1, maxLength: 8192, description: Non-empty UTF-8 without NUL; stored byte-identically}
        delivery_binding_id: {$ref: '#/components/schemas/UUID'}
        instance_id: {$ref: '#/components/schemas/UUID'}
    DeliveryMessage:
      type: object
      additionalProperties: false
      required: [id, task_id, delivery_binding_id, text, status, blocked, created_at]
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        task_id: {$ref: '#/components/schemas/UUID'}
        delivery_binding_id: {$ref: '#/components/schemas/UUID'}
        text: {type: string}
        status: {type: string, enum: [stored, unknown, observed]}
        blocked: {type: boolean}
        block_reason: {type: string, enum: [task_closed, project_archived, delivery_revoked]}
        created_at: {type: string, format: date-time}
    DeliveryBinding:
      type: object
      additionalProperties: false
      required: [delivery_binding_id, observer_id, runtime_id, project_id, pi_session_id, journal_id, generation, status, created_at]
      properties:
        delivery_binding_id: {$ref: '#/components/schemas/UUID'}
        observer_id: {$ref: '#/components/schemas/UUID'}
        runtime_id: {$ref: '#/components/schemas/UUID'}
        project_id: {$ref: '#/components/schemas/UUID'}
        pi_session_id: {$ref: '#/components/schemas/UUID'}
        journal_id: {$ref: '#/components/schemas/UUID'}
        generation: {type: integer, minimum: 0}
        status: {type: string, enum: [pending, active, revoked]}
        allow_owner_questions: {type: boolean}
        owner_questions_capability: {type: string, enum: [owner_questions_v1]}
        created_at: {type: string, format: date-time}
    EnableDelivery:
      type: object
      additionalProperties: false
      required: [expected_version, delivery_binding_id, journal_id, verifier, runtime_id, project_id, pi_session_id, instance_id]
      properties:
        expected_version: {$ref: '#/components/schemas/Version'}
        delivery_binding_id: {$ref: '#/components/schemas/UUID'}
        journal_id: {$ref: '#/components/schemas/UUID'}
        verifier: {type: string, pattern: '^[0-9a-f]{64}$'}
        runtime_id: {$ref: '#/components/schemas/UUID'}
        project_id: {$ref: '#/components/schemas/UUID'}
        pi_session_id: {$ref: '#/components/schemas/UUID'}
        instance_id: {$ref: '#/components/schemas/UUID'}
        allow_owner_questions:
          type: boolean
          description: New grant-only opt-in. False or absent preserves the v3 enable request and receipt hash.
    DeliveryProjection:
      type: object
      additionalProperties: false
      required: [task_id, project_id, binding]
      properties:
        task_id: {$ref: '#/components/schemas/UUID'}
        project_id: {$ref: '#/components/schemas/UUID'}
        binding:
          type: object
          nullable: true
          allOf: [{$ref: '#/components/schemas/DeliveryBinding'}]
        ready: {type: boolean}
    Event:
      type: object
      additionalProperties: false
      required: [seq, action, project_id, source, timestamp, before, after]
      properties:
        seq: {type: integer, minimum: 1}
        action: {type: string}
        project_id: {$ref: '#/components/schemas/UUID'}
        task_id: {$ref: '#/components/schemas/UUID'}
        source: {type: string, enum: [owner_manual]}
        timestamp: {type: string, format: date-time}
        before:
          type: object
          description: 'Keys are object-kind:UUID (project/task/queue), values contain changed fields and old versions; null denotes an absent field.'
          additionalProperties: {type: object, additionalProperties: {nullable: true}}
        after:
          type: object
          description: 'Keys are object-kind:UUID (project/task/queue), values contain changed fields and new versions.'
          additionalProperties: {type: object, additionalProperties: {nullable: true}}
    Snapshot:
      type: object
      additionalProperties: false
      required: [instance_id, event_seq, projects, tasks, queues]
      properties:
        instance_id: {$ref: '#/components/schemas/UUID'}
        event_seq: {type: integer, minimum: 0}
        projects: {type: array, items: {$ref: '#/components/schemas/Project'}}
        tasks: {type: array, items: {$ref: '#/components/schemas/Task'}}
        queues: {type: array, items: {$ref: '#/components/schemas/Queue'}}
